name: AI Study Assistant CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        run: pytest



      - name: Build backend Docker image
        run: docker build -t ai-study-assistant-backend ./backend


      - name: Build frontend Docker image
        run: docker build -t ai-study-assistant-frontend ./frontend

              - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push backend Docker image
        run: |
          docker tag ai-study-assistant-backend ${{ vars.DOCKER_USERNAME }}/ai-study-assistant-backend:latest
          docker push ${{ vars.DOCKER_USERNAME }}/ai-study-assistant-backend:latest

      - name: Push frontend Docker image
        run: |
          docker tag ai-study-assistant-frontend ${{ vars.DOCKER_USERNAME }}/ai-study-assistant-frontend:latest
          docker push ${{ vars.DOCKER_USERNAME }}/ai-study-assistant-frontend:latest


